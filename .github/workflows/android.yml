name: Android

# CI for every push and pull request: debug build, unit tests, lint and instrumented tests on an emulator. Unsigned debug APK only;
# release builds are made locally with scripts/release-github.sh and scripts/build-android-play.sh.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # v3 defaults to "tools platform-tools"; the obsolete "tools" package makes newer sdkmanager fail.
          packages: platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Release script tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Build, unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: PassVault-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }

  # Instrumented tests (real Android Keystore, vault storage, file encryption on ART) on an emulator, using the emulator-only
  # "qa" variant, which accepts software-backed keys and does not need the device unlocked. Keystore keys still need a secure lock
  # screen, hence the PIN (.github/scripts/set-emulator-pin.sh).
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: |
            sh ../.github/scripts/set-emulator-pin.sh
            ./gradlew --no-daemon :app:connectedQaAndroidTest

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: instrumented-test-report, path: android/app/build/reports/androidTests/ }
