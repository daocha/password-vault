name: iOS

# CI for every push and pull request. The installable IPA is produced by the
# manual test-builds workflow when signing credentials are available.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Swift unit tests
        run: swift test --package-path ios

      - name: Core security checks
        run: swift run --package-path ios vault-security-checks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS app
        working-directory: ios
        run: >-
          xcodebuild -project PassVault.xcodeproj -scheme PassVault
          -configuration Debug -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build

      - name: Test language switching in Simulator
        working-directory: ios
        run: >-
          xcodebuild -project PassVault.xcodeproj -scheme PassVault
          -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
