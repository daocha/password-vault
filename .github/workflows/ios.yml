name: iOS

# CI for pull requests and pushes to main. The installable IPA is produced by the
# manual test-builds workflow when signing credentials are available.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/CODEOWNERS', '.github/dependabot.yml']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/CODEOWNERS', '.github/dependabot.yml']
  # Emulator and simulator tests skip pushes to main (the pull request ran them), so check main once a night.
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:

# A new push to a pull request replaces its older run, so outdated runs do not hold up the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Swift unit tests
        run: swift test --package-path ios

      - name: Core security checks
        run: swift run --package-path ios vault-security-checks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS app
        working-directory: ios
        run: >-
          xcodebuild -project PassVault.xcodeproj -scheme PassVault
          -configuration Debug -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build

      - name: Test vault lifecycle, settings and language switching in Simulator
        if: github.event_name != 'push'
        working-directory: ios
        run: >-
          xcodebuild -project PassVault.xcodeproj -scheme PassVault
          -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -parallel-testing-enabled NO -retry-tests-on-failure -test-iterations 2
          CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
