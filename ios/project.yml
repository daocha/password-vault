name: PassVault
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: '17.0'
configs:
  Debug: debug
  Release: release
settings:
  configs:
    # The app's bundle ID. The AutoFill extension's is this plus ".autofill", and both share the app group group.<this>.
    Debug:
      PASSVAULT_APP_ID: app.passvault.mobile.debug
    Release:
      PASSVAULT_APP_ID: app.passvault.mobile
packages:
  VaultCore:
    path: .
targets:
  PassVault:
    type: application
    platform: iOS
    sources: [PassVault]
    dependencies:
      - package: VaultCore
      - target: PassVaultAutoFill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.passvault.mobile
        # Manually signed builds name each target's profile (test-builds.yml); automatic signing leaves them empty.
        PROVISIONING_PROFILE_SPECIFIER: $(PASSVAULT_APP_PROFILE)
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PassVault
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your vault with Face ID.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the QR code a site shows when you turn on two-factor authentication. Images are read on this device only.
        INFOPLIST_KEY_UIFileSharingEnabled: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
        # Standard, published algorithms only and no App Store sales in France: no export documentation (docs/RELEASING.md).
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PassVault/PassVault.entitlements
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.passvault.mobile.debug
          INFOPLIST_KEY_CFBundleDisplayName: PassVault Dev

  # AutoFill: fills logins in other apps and Safari from the shared vault (see AutoFill/CredentialProviderViewController.swift).
  PassVaultAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - AutoFill
      - PassVault/KeychainStorage.swift
      - PassVault/PasswordInput.swift
    dependencies:
      - package: VaultCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PASSVAULT_APP_ID).autofill
        PRODUCT_NAME: PassVaultAutoFill
        PROVISIONING_PROFILE_SPECIFIER: $(PASSVAULT_AUTOFILL_PROFILE)
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: AutoFill/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: PassVault
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your vault with Face ID.
        CODE_SIGN_ENTITLEMENTS: AutoFill/AutoFill.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          INFOPLIST_KEY_CFBundleDisplayName: PassVault Dev

  PassVaultAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: PassVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.passvault.mobile.apptests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.9'

  PassVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PassVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.passvault.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.9'

schemes:
  PassVault:
    build:
      targets:
        PassVault: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [PassVaultAppTests, PassVaultUITests]
    archive:
      config: Release
