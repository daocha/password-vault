name: PassVault
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: '17.0'
configs:
  Debug: debug
  Release: release
packages:
  VaultCore:
    path: .
targets:
  PassVault:
    type: application
    platform: iOS
    configFiles:
      Release: Config/AppStore.xcconfig
    sources: [PassVault]
    dependencies:
      - package: VaultCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.passvault.mobile
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PassVault
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your vault with Face ID.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the QR code a site shows when you turn on two-factor authentication. Images are read on this device only.
        INFOPLIST_KEY_UIFileSharingEnabled: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PassVault/PassVault.entitlements
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.passvault.mobile.debug
          INFOPLIST_KEY_CFBundleDisplayName: PassVault Dev

  PassVaultAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: PassVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.passvault.mobile.apptests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.9'

  PassVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PassVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.passvault.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.9'

schemes:
  PassVault:
    build:
      targets:
        PassVault: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [PassVaultAppTests, PassVaultUITests]
    archive:
      config: Release
